[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "one-health-lyme-gap-atlas-shared"
version = "0.1.0"
description = "Shared contracts and infrastructure for the One Health Lyme Gap Atlas"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cryptography>=44,<46",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "snowflake-connector-python>=3.14,<5",
]

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/lyme_gap_atlas_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lyme_gap_atlas_shared"]

