name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra legacy --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build
      - name: Verify portable base install
        run: |
          uv venv .portable-venv
          uv pip install --python .portable-venv/bin/python .
          .portable-venv/bin/python -c "import lyme_gap_atlas_shared.domain; import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('snowflake', 'pydantic_settings', 'opentelemetry', 'neo4j'))"
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner
